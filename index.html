<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartopia 攻略站 - 选择语言 / Select Language</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8056336868145780"
     crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1.5rem;text-align:center;padding:2rem}
.logo-big{font-family:'Outfit',sans-serif;font-size:36px;font-weight:700;color:var(--pink)}
.logo-big span{color:var(--text)}
.subtitle{font-size:14px;color:var(--text3);margin-top:-8px}
.lang-picks{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.lang-pick{padding:12px 28px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-size:15px;text-decoration:none;color:var(--text);transition:all .15s;font-family:'Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:130px}
.lang-pick:hover{border-color:var(--pink-mid);color:var(--pink);box-shadow:var(--shadow)}
.lang-pick.primary{background:var(--pink);color:white;border-color:var(--pink)}
.lang-pick .flag{font-size:24px}
.lang-pick .label{font-size:14px;font-weight:500}
.lang-pick .sublabel{font-size:11px;opacity:.8}
</style>
</head>
<body>
<div class="logo-big">♥ <span>Heartopia</span></div>
<div class="subtitle">Select your language / 选择语言 / 選擇語言</div>
<div class="lang-picks">
  <a href="zh/index.html" class="lang-pick primary" id="pick-zh">
    <span class="flag">🇨🇳</span>
    <span class="label">简体中文</span>
    <span class="sublabel">Simplified Chinese</span>
  </a>
  <a href="zh-tw/index.html" class="lang-pick" id="pick-tw">
    <span class="flag">🇹🇼</span>
    <span class="label">繁體中文</span>
    <span class="sublabel">Traditional Chinese</span>
  </a>
  <a href="en/index.html" class="lang-pick" id="pick-en">
    <span class="flag">🇬🇧</span>
    <span class="label">English</span>
    <span class="sublabel">English</span>
  </a>
</div>
<script>
  const lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
  if (lang.startsWith('zh-tw') || lang.startsWith('zh-hk') || lang.startsWith('zh-mo')) {
    location.replace('zh-tw/index.html');
  } else if (lang.startsWith('zh')) {
    location.replace('zh/index.html');
  } else {
    location.replace('en/index.html');
  }
</script>
</body>
</html>
